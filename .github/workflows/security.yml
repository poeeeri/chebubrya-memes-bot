name: security

on:
    push:
    pull_request:

jobs:
    sast:
        name: SAST Bandit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Install Bandit
              run: python -m pip install bandit==1.9.4
            - name: Run Bandit
              run: |
                mkdir -p security-reports
                bandit -r src -c bandit.yaml -f json -o security-reports/bandit-report.json
                bandit -r src -c bandit.yaml -f txt -o security-reports/bandit-report.txt
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                name: bandit-report
                path: security-reports/bandit-report.*

    sca:
        name: SCA pip-audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Install pip-audit
              run: python -m pip install pip-audit==2.10.0
            - name: Run pip-audit
              run: |
                mkdir -p security-reports
                pip-audit -r requirements.txt -f json -o security-reports/pip-audit-report.json
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                name: pip-audit-report
                path: security-reports/pip-audit-report.json
    
    dast:
        name: DAST OWASP ZAP
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: Start DAST target
              run: |
                PYTHONPATH=src python -m security_lab.dast_target --host 0.0.0.0 --port 8080 &
                sleep 3
            - name: Run ZAP baseline scan
              uses: zaproxy/action-baseline@v0.14.0
              with:
                target: "http://127.0.0.1:8080"
                cmd_options: "-a -J zap-report.json -r zap-report.html"
                fail_action: false
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                name: zap-report
                path: |
                    report_html.html
                    report_json.json
                    zap-report.html
                    zap-report.json