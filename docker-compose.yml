services:
  memes-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memes-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://${POSTGRES_USER:-memes_bot}:${POSTGRES_PASSWORD:-memes_bot_password}@postgres:5432/${POSTGRES_DB:-memes_bot}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/memes/memes-bot/storage/chroma:/app/storage/chroma
      - /home/memes/dataset:/home/memes/dataset:ro
      - /home/memes/memes-bot/models:/app/models

  postgres:
    image: postgres:16
    container_name: memes-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memes_bot}
      POSTGRES_USER: ${POSTGRES_USER:-memes_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memes_bot_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memes_bot -d memes_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: